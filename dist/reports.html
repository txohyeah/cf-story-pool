<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>报告 - 需求池</title><link rel="stylesheet" href="/style.css"></head>
<body class="page-testcases">
<nav class="topbar" aria-label="主导航">
  <a class="btn small" href="/index.html">需求</a>
  <a class="btn small nav-link" href="/docs.html">文档</a>
  <a class="btn small nav-link" href="/releases.html">版本</a>
  <a class="btn small nav-link" href="/testcases.html">用例</a>
  <a class="btn small nav-link" href="/feature-points.html">功能点</a>
  <a class="btn small nav-link" href="/baselines.html">基线</a>
  <a class="btn small nav-link" href="/runs.html">轮次</a>
  <a class="btn small nav-link" href="/reports.html" aria-current="page">报告</a>
  <span style="flex:1"></span><span id="current-user" class="sub" style="min-width:0;max-width:100%;overflow-wrap:anywhere"></span>
  <select id="g-bar" aria-label="切换项目"></select><a class="btn small" href="/index.html">返回首页</a><a class="btn small" href="javascript:logout()">退出</a>
</nav>
<div class="wrap" style="min-width:0">
  <div class="card section-toolbar" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><strong>报告</strong><select id="proj-sel" aria-label="项目"></select><label>版本 <select id="release-filter"><option value="">全部版本</option></select></label></div>
  <div class="err" id="page-error" role="alert" style="display:none;overflow-wrap:anywhere"></div>
  <div id="list-view" class="card" style="min-width:0;overflow-wrap:anywhere"></div><div id="detail-view" class="card" style="display:none;min-width:0;overflow-wrap:anywhere"></div>
</div>
<script src="/app-common.js"></script>
<script>
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(path,opts){try{const r=await fetch(path,opts);if(r.status===401){location.href='/login';return {status:401,body:{error:'请先登录'}};}let body={};try{body=await r.json();}catch(e){}return {status:r.status,body};}catch(e){return {status:0,body:{error:'网络错误，请稍后重试'}};}}
function jsonOpts(method,body){return {method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)};}
function errorAt(id,message){const el=$(id);el.textContent=message||'';el.style.display=message?'block':'none';}
function fmtAt(s){if(!s)return '—';const raw=String(s),iso=/Z$|[+-]\d\d:\d\d$/.test(raw)?raw:raw.replace(' ','T')+'Z',d=new Date(iso);return isNaN(d.getTime())?raw:d.toLocaleString('zh-CN',{hour12:false});}
function versionName(v){const s=String(v==null?'':v);return s?(/^v/i.test(s)?s:'v'+s):'—';}
const STATES={draft:['草稿','#6b7280'],approved:['已批准','#2563eb'],frozen:['已冻结','#16a34a']};
const RESULTS={pass:'通过',fail:'失败',deviation:'偏离',diff:'差异',empty:'未执行','':'未执行'};
const CATEGORIES={new_fail:'新失败',old_fail:'老失败',fixed:'已修复',diff_accepted:'差异获批',still_pass:'保持通过',not_comparable:'不可比'};
let releases=[],report=null,seq=0;
function badge(s){const a=STATES[s]||[s||'未知','#6b7280'];return `<span class="badge" style="color:${esc(a[1])}">${esc(a[0])}</span>`;}
function percent(n){return (Number(n||0)*100).toFixed(2)+'%';}
function countSummary(c){return `总数 ${esc(c.total||0)} / 通过 ${esc(c.pass||0)} / 失败 ${esc(c.fail||0)} / 偏离 ${esc(c.deviation||0)} / 差异获批 ${esc(c.diff_accepted||0)} / 拒绝 ${esc(c.diff_rejected||0)} / 未签 ${esc(c.diff_unsigned||0)} / 未执行 ${esc(c.empty||0)}`;}
async function logout(){const r=await api('/api/logout',{method:'POST'});if(r.body.error)errorAt('page-error',r.body.error);else location.href='/login';}
async function init(){const me=await api('/api/me');if(me.body.error){errorAt('page-error',me.body.error);return;}$('current-user').textContent=me.body.display_name||me.body.username||'';const boot=await api('/api/bootstrap');if(!boot.body.ok){errorAt('page-error',boot.body.error||'加载项目失败');return;}const projects=boot.body.projects||[];$('proj-sel').innerHTML=projects.map(p=>`<option value="${Number(p.id)}">${esc(p.name)}</option>`).join('');const params=new URL(location.href).searchParams,want=params.get('project')||PoolUI.getProject();if(projects.some(p=>String(p.id)===want))$('proj-sel').value=want;if($('proj-sel').value)PoolUI.setProject($('proj-sel').value);PoolUI.renderProjectBar('g-bar',{defaultFirst:true,allowAll:false,onChange:v=>location.href='/reports.html?project='+encodeURIComponent(v)});$('proj-sel').onchange=()=>{PoolUI.setProject($('proj-sel').value);location.href='/reports.html?project='+encodeURIComponent($('proj-sel').value);};$('release-filter').onchange=()=>{if(report)showList();else loadList();};if(!projects.length){$('list-view').textContent='暂无可用项目，请先创建项目。';return;}const r=await api('/api/releases?project='+encodeURIComponent($('proj-sel').value));if(!r.body.ok){errorAt('page-error',r.body.error||'加载版本失败');return;}releases=r.body.items||[];$('release-filter').innerHTML='<option value="">全部版本</option>'+releases.map(x=>`<option value="${esc(x.version)}">${esc(versionName(x.version))}</option>`).join('');if(releases.length)$('release-filter').value=String(releases[0].version);const id=params.get('id');if(id&&/^[1-9]\d*$/.test(id))await loadDetail(Number(id));else await loadList();}
async function loadList(){const current=++seq;errorAt('page-error','');const r=await api('/api/reports?project_id='+encodeURIComponent($('proj-sel').value));if(current!==seq)return;if(!r.body.ok){errorAt('page-error',r.body.error||'加载报告失败');return;}const filter=$('release-filter').value,items=(r.body.items||[]).filter(x=>!filter||String(x.release_version)===filter);$('list-view').innerHTML=items.length?items.map(x=>`<div class="tc-row" style="cursor:default;overflow-wrap:anywhere"><strong>${esc(x.report_code)} r${esc(x.revision)}</strong>${badge(x.state)}<span>轮次 #${esc(x.run_round_no)} · ${esc(versionName(x.release_version))}</span><span>通过率 ${esc(percent(x.pass_rate))}</span><span>${countSummary(x.counts||{})}</span><span>${esc(fmtAt(x.created_at))}</span><button class="btn small" onclick="openDetail(${Number(x.id)})">查看</button><button class="btn small" onclick="exportReport(${Number(x.id)})">导出</button></div>`).join(''):'<div class="sub">还没有报告，去轮次页关轮后生成。</div>';}
function openDetail(id){const url=new URL(location.href);url.searchParams.set('project',$('proj-sel').value);url.searchParams.set('id',id);history.pushState(null,'',url.pathname+url.search);loadDetail(id);}
function showList(){report=null;seq++;const url=new URL(location.href);url.searchParams.delete('id');history.pushState(null,'',url.pathname+url.search);$('detail-view').style.display='none';$('list-view').style.display='block';loadList();}
async function loadDetail(id){const current=++seq;errorAt('page-error','');const r=await api('/api/reports/'+id+'?project_id='+encodeURIComponent($('proj-sel').value));if(current!==seq)return;if(!r.body.ok){errorAt('page-error',r.body.error||'加载报告失败');return;}try{report={meta:r.body.report,snapshot:JSON.parse(r.body.report.snapshot_json)};}catch(e){errorAt('page-error','报告快照格式错误');return;}renderDetail();}
function renderDetail(){const m=report.meta,s=report.snapshot,c=s.counts||{},e=s.effective||{},comparison=s.comparison;$('list-view').style.display='none';const el=$('detail-view');el.style.display='block';el.innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><strong>${esc(m.report_code)} r${esc(m.revision)}</strong>${badge(m.state)}<span>轮次 #${esc(m.run_round_no)} · 版本 ${esc(versionName(m.release_version))}</span><span style="flex:1"></span><button class="btn small" onclick="showList()">返回列表</button></div><div class="sub">生成 ${esc(fmtAt(m.created_at))} ｜ 批准 ${esc(m.approved_by_name||'—')} ${esc(fmtAt(m.approved_at))} ｜ 冻结 ${esc(m.frozen_by_name||'—')} ${esc(fmtAt(m.frozen_at))}</div><div style="overflow-wrap:anywhere">快照哈希：<span class="mono">${esc(m.snapshot_hash)}</span> <button class="btn small" onclick="copyHash()">复制</button></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">${m.state==='draft'?'<button class="btn primary small" onclick="transition(\'approve\')">批准</button>':''}${m.state==='approved'?'<button class="btn primary small" onclick="transition(\'freeze\')">冻结</button>':''}${m.state==='frozen'?'<button class="btn small" onclick="transition(\'revision\')">更正（新建 revision）</button>':''}<button class="btn small" onclick="exportReport(${Number(m.id)})">导出 JSON</button></div><div class="card"><strong>摘要</strong><div>${countSummary(c)}</div><div>已执行 ${esc(e.executed||0)} ｜ 有效通过 ${esc(e.pass||0)} ｜ 有效失败 ${esc(e.fail||0)} ｜ 通过率 ${esc(percent(e.pass_rate))}</div><div class="sub">DIFF 未签或拒绝按失败计，已接受单列</div></div><h3>用例条目</h3>${(s.items||[]).length?(s.items||[]).map(i=>`<div class="tc-row" style="cursor:default;overflow-wrap:anywhere"><strong>${esc(i.tc_code)}</strong><span>${esc(i.title)}</span><span>${esc(i.layer)} / v${esc(i.tc_version)}</span><span>${esc(RESULTS[i.result]||i.result||'未执行')} → ${esc(RESULTS[i.effective]||i.effective)}</span><span>签字 ${esc(i.diff_decision==='accept'?'已接受':i.diff_decision==='reject'?'已拒绝':i.result==='diff'?'未签字':'—')}</span><span>${esc(i.executor||'—')} / ${esc(fmtAt(i.executed_at))}</span><span>证据 ${esc(i.evidence_count||0)}</span></div>`).join(''):'<div class="sub">暂无条目。</div>'}<h3>跨轮对比</h3>${comparison?comparisonSection(comparison):'<div class="sub">本报告未关联对比轮次</div>'}`;}
function comparisonSection(c){const sum=c.summary||{};return `<div>${Object.keys(CATEGORIES).map(k=>`<span class="badge">${esc(CATEGORIES[k])} ${esc(sum[k]||0)}</span>`).join(' ')}</div><details><summary>查看配对详情</summary>${(c.pairs||[]).map(p=>`<div class="tc-row" style="cursor:default"><strong>${esc(p.tc_code)}</strong><span>${esc(p.title)}</span><span>${esc(p.before?RESULTS[p.before.result]||p.before.result||'未执行':'—')} → ${esc(p.after?RESULTS[p.after.result]||p.after.result||'未执行':'—')}</span><span>${esc(CATEGORIES[p.category]||p.category)}</span></div>`).join('')}</details>`;}
async function transition(action){if(!report)return;const id=report.meta.id,r=await api('/api/reports/'+id+'/'+action,jsonOpts('POST',{project_id:Number($('proj-sel').value)}));if(!r.body.ok){errorAt('page-error',r.body.error||'操作失败');return;}if(action==='revision')openDetail(r.body.id);else await loadDetail(id);}
function exportReport(id){location.href='/api/reports/'+Number(id)+'/export?project_id='+encodeURIComponent($('proj-sel').value)+'&format=json';}
async function copyHash(){try{await navigator.clipboard.writeText(report.meta.snapshot_hash);errorAt('page-error','');}catch(e){errorAt('page-error','复制失败，请手动选择哈希复制');}}
window.addEventListener('popstate',()=>{const id=new URL(location.href).searchParams.get('id');if(id&&/^[1-9]\d*$/.test(id))loadDetail(Number(id));else{report=null;seq++;$('detail-view').style.display='none';$('list-view').style.display='block';loadList();}});
init();
</script>
</body></html>
