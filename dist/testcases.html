<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用例库 - 需求池</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="page-testcases">
<nav class="topbar" aria-label="主导航">
  <a class="btn small" href="/index.html">需求</a>
  <a class="btn primary small" href="javascript:PoolUI.openNewReqModalForPage(3, function (id) { location.href = '/testcases.html?project=' + (PoolUI.getProject() || '3'); })">＋ 新需求</a>
  <a class="btn small nav-link" href="/docs.html">文档</a>
  <a class="btn small nav-link" href="/releases.html">版本</a>
  <a class="btn small nav-link" aria-current="page" href="/testcases.html">用例</a>
  <a class="btn small nav-link" href="/feature-points.html">功能点</a>
  <a class="btn small nav-link" href="/index.html?project=all" title="在需求列表中筛选并导出">导出</a>
  <span style="flex:1"></span>
  <a class="btn small" href="javascript:location.href='/api/export-package?project=' + (PoolUI.getProject() || document.getElementById('proj-sel').value)">📦 数据包</a>
  <select id="g-bar"></select>
  <a class="btn small" href="javascript:openPwdModal()">改密码</a>
  <a class="btn small" href="javascript:logout()">退出</a>
</nav>
<div class="wrap">
  <div class="card section-toolbar" style="margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <strong>用例库</strong>
    <select id="proj-sel" class="fld-row" style="padding:6px 8px"></select>
    <span style="flex:1"></span>
    <button class="btn primary small" id="btn-new-tc">＋ 新用例</button>
  </div>
  <div class="card" id="list"></div>

  <div class="card detail" id="detail"></div>
</div>

<div class="modal-overlay" id="new-overlay" style="display:none">
  <div class="modal card" style="width:min(560px,94vw);max-height:90vh;overflow:auto">
    <h3>新建用例</h3>
    <div class="fld-row"><label>项目</label><select id="n-proj" style="flex:1;padding:8px"></select></div>
    <div class="fld-row"><label>标题</label><input id="n-title" style="flex:1;padding:8px" maxlength="200"></div>
    <div class="fld-row"><label>关联需求</label><select id="n-req" style="flex:1;padding:8px"><option value="">不关联</option></select></div>
    <div class="fld-row"><label>风险级</label><select id="n-risk" style="flex:1;padding:8px">
      <option value="high">高</option><option value="middle" selected>中</option>
      <option value="low">低</option><option value="external">外部依赖</option></select></div>
    <div class="fld-row"><label>用例类型</label><select id="n-ctype" style="flex:1;padding:8px">
      <option value="positive">正向</option><option value="negative">负向</option><option value="boundary">边界</option></select></div>
    <label class="fld"><span>前置 / 步骤 / 预期（Markdown）</span><textarea id="n-steps" rows="6" class="mono"></textarea></label>
    <div class="err" id="n-err" style="display:none"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button class="btn" onclick="closeNew()">取消</button>
      <button class="btn primary" id="n-save">创建</button>
    </div>
  </div>
</div>

<script src="/app-common.js"></script>
<script>
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) { location.href = '/login'; return {}; }
  return r.json();
}
function logout() { fetch('/api/logout', { method: 'POST' }).then(() => location.href = '/login'); }
function openPwdModal() { location.href = '/index.html'; }
function $(id) { return document.getElementById(id); }
function closeNew() { $('new-overlay').style.display = 'none'; $('n-err').style.display = 'none'; }

const RN = { high: '高', middle: '中', low: '低', external: '外部依赖' };
const CT = { positive: '正向', negative: '负向', boundary: '边界' };
const TST = { draft: ['草稿', '#888', '#f2f2f2'], approved: ['已批准', '#15803d', '#dcfce7'] };
const RES = { pass: ['通过', '#15803d', '#dcfce7'], fail: ['未通过', '#b91c1c', '#fee2e2'],
              deviation: ['偏差', '#c2410c', '#ffedd5'], '': ['未执行', '#888', '#f2f2f2'] };

async function init() {
  PoolUI.renderProjectBar('g-bar', { defaultFirst: true, onChange: v => { location.href = '/testcases.html?project=' + v; } });
  const m = await api('/api/me'); me = (m && m.authed) ? m.user_id : null;  // /api/me 返回 user_id
  const b = await api('/api/bootstrap');
  const projects = (b && b.projects) || [];
  $('proj-sel').innerHTML = $('n-proj').innerHTML = projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  const SP = new URL(location.href).searchParams;
  const want = SP.get('project') || PoolUI.getProject();
  if (want && projects.some(p => String(p.id) === want)) { $('proj-sel').value = want; $('n-proj').value = want; }
  PoolUI.setProject($('proj-sel').value);
  $('proj-sel').onchange = () => { PoolUI.setProject($('proj-sel').value); $('n-proj').value = $('proj-sel').value; closeDetail(); loadList(); };
  $('btn-new-tc').onclick = () => { $('new-overlay').style.display = 'flex'; refreshReqOptions(); };
  await loadList();
  // 抽屉↔用例库联动：?tc=<id> 从需求抽屉跳入时自动切项目并展开该用例
  const tcWanted = parseInt(SP.get('tc'), 10);
  if (tcWanted) {
    const det = await api('/api/testcases/' + tcWanted);
    if (det && det.ok) {
      $('proj-sel').value = String(det.tc.project_id);
      await loadList();
      openTc(tcWanted);
      $('detail').scrollIntoView({ behavior: 'smooth' });
    }
  }
}
let me = null, releases = [], projectReqs = [], detailTcId = null, detailFeaturePoints = [];

// 方案A：related_req 下拉选项（列本项目需求，减少手填错号）
async function refreshReqOptions() {
  const pid = $('n-proj').value || $('proj-sel').value;
  if (!pid) { projectReqs = []; $('n-req').innerHTML = '<option value="">不关联</option>'; return; }
  const d = await api('/api/requirements?project=' + pid + '&page_size=50');
  projectReqs = (d && d.items) || [];
  $('n-req').innerHTML = '<option value="">不关联</option>'
    + projectReqs.map(q => `<option value="${q.id}">#${q.id} ${esc(q.title)}</option>`).join('');
}

async function loadList() {
  const pid = $('proj-sel').value;
  if (!pid) return;
  releases = (await api('/api/releases?project=' + pid)).items || [];
  await refreshReqOptions();
  const r = await api('/api/testcases?project=' + pid);
  const items = (r && r.items) || [];
  // 方案A：按关联需求分组（需求=用例集合的自然分组键）；未关联的归"未分组"排最后
  const groups = new Map();
  for (const x of items) {
    const k = x.related_req ? String(x.related_req) : 'none';
    if (!groups.has(k)) groups.set(k, { req_id: x.related_req, title: x.related_req_title || '', tcs: [] });
    groups.get(k).tcs.push(x);
  }
  const ordered = [...groups.entries()].sort((a, b) => {
    if (a[0] === 'none') return 1; if (b[0] === 'none') return -1;
    return (parseInt(a[0], 10) || 0) - (parseInt(b[0], 10) || 0);
  });
  const tcRow = x => `
    <div class="tc-row" onclick="openTc(${x.id})">
      <span class="tc-code">${esc(x.tc_code)}</span>
      <span style="flex:1">${esc(x.title)}</span>
      <span>${RN[x.risk] || x.risk}</span><span>${CT[x.ctype] || x.ctype}</span>
      <span>${(TST[x.status] || TST.draft)[0]}</span>
    </div>`;
  $('list').innerHTML = `<div class="tc-row" style="font-weight:700;background:#f4f4f8">
      <span class="tc-code">编号</span><span style="flex:1">标题</span>
      <span>风险</span><span>类型</span><span>状态</span></div>`
    + (items.length ? ordered.map(([k, g]) => {
        const head = k === 'none'
          ? `<div class="tc-row" style="background:#fbfbfd;font-weight:600;color:#666">📦 未分组（尚未关联需求）· ${g.tcs.length} 条</div>`
          : `<div class="tc-row" style="background:#fbfbfd;font-weight:600">📦 <a href="/index.html?project=${pid}&req=${k}" style="color:#4f46e5">#${k}</a> ${esc(g.title)} · ${g.tcs.length} 条</div>`;
        return head + g.tcs.map(tcRow).join('');
      }).join('') : '<div class="tc-row" style="color:#888">暂无用例，点右上角「＋ 新用例」创建</div>');
}

function closeDetail() { detailTcId = null; $('detail').classList.remove('open'); $('detail').innerHTML = ''; }

async function apiTcDetailWithApprover(id) { return api('/api/testcases/' + id); }
async function openTc(id) {
  const d = await apiTcDetailWithApprover(id);
  if (!d || !d.ok) return;
  const t = d.tc, ex = d.executions;
  const featurePoints = Array.isArray(d.feature_points) ? d.feature_points : [];
  detailTcId = id;
  detailFeaturePoints = featurePoints;
  // 批准人显示：approved_by 是 id，从 versions/executors 不可得——detail 补 approver 名（worker 返回 approver 字段）
  const el = $('detail');
  el.classList.add('open');
  el.innerHTML = `
    <div class="proj-head" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <strong style="font-family:monospace;color:#4f46e5">${esc(t.tc_code)}</strong>
      <strong style="flex:1">${esc(t.title)}</strong>
      <span class="badge" style="color:${(TST[t.status]||TST.draft)[1]};background:${(TST[t.status]||TST.draft)[2]}">${(TST[t.status]||TST.draft)[0]}</span>
      ${d.retired ? '<span class="badge">已退役</span>' : ''}
      <button class="btn small" onclick="closeDetail()">✕ 收起</button>
    </div>
    <div class="sub" style="color:#888;font-size:12px;margin:6px 0">
      风险 ${RN[t.risk]} ｜ ${CT[t.ctype]} ｜ v${t.current_version} ｜ 创建 ${esc(t.creator || '-')}
      ${t.status === 'approved' && t.approved_at ? ' ｜ 批准 ' + esc(t.approver || '-') + ' ' + esc(t.approved_at.slice(0, 10)) : ''}
      ${t.related_req ? ' ｜ 关联需求 <a href="javascript:void(0)" onclick="sessionStorage.tcBack=1;location.href=\'/index.html?project=' + t.project_id + '&req=' + t.related_req + '\'">#' + t.related_req + '</a>' : ''}
      ${t.covers_urs ? ' ｜ URS：' + esc(t.covers_urs) : ''}
    </div>
    <div class="fld-row" id="tc-edit" style="display:none;flex-direction:column;gap:8px">
      <input id="t-title" value="${esc(t.title)}" style="padding:8px" maxlength="200">
      <div class="fld-row">
        <label class="fld"><span>风险级</span><select id="t-risk">
          ${['high','middle','low','external'].map(k => `<option value="${k}" ${t.risk===k?'selected':''}>${RN[k]}</option>`).join('')}</select></label>
        <label class="fld"><span>类型</span><select id="t-ctype">
          ${['positive','negative','boundary'].map(k => `<option value="${k}" ${t.ctype===k?'selected':''}>${CT[k]}</option>`).join('')}</select></label>
        <label class="fld" style="flex:1"><span>关联需求</span><select id="t-req" style="width:100%;padding:8px">
          <option value="">不关联</option>
          ${projectReqs.map(q => `<option value="${q.id}" ${t.related_req===q.id?'selected':''}>#${q.id} ${esc(q.title)}</option>`).join('')}
        </select></label>
      </div>
      <textarea id="t-steps" rows="10" class="mono">${esc(d.steps_md)}</textarea>
      <label class="fld"><span>${t.status === 'approved' ? '修订摘要（已批准用例必填）' : '修订摘要（选填）'}</span><input id="t-summary" style="padding:8px"></label>
      <div style="display:flex;gap:8px">
        <button class="btn primary small" onclick="saveTc(${id}, ${t.current_version}, ${t.status === 'approved'})">保存为新版本</button>
        <button class="btn small" onclick="closeDetail();loadList()">取消</button>
      </div>
    </div>
    <div id="tc-view" style="margin-top:8px;white-space:pre-wrap;font-size:13px;line-height:1.6">${esc(d.steps_md) || '<span style="color:#aaa">（无步骤内容）</span>'}</div>
    <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn small" onclick="toggleEdit()">✏️ 编辑</button>
      ${t.status === 'draft' ? `<button class="btn primary small" onclick="approve(${id})">批准</button>`
        : `<button class="btn small" onclick="unapprove(${id})">撤回草稿</button>`}
      <button class="btn small danger" onclick="delTc(${id})">删除</button>
      <button class="btn small" onclick="changeTcRetired(${id}, '${d.retired ? 'revive' : 'retire'}')">${d.retired ? '恢复' : '退役'}</button>
      <button class="btn small" onclick="showTcVersions(${id})">版本历史</button>
    </div>
    <div id="tc-versions" style="display:none;margin-top:10px"></div>
    <div style="margin-top:14px"><strong>功能点</strong> <button class="btn small" onclick="editTcFeatures(${id}, ${t.project_id})">编辑</button>
      <div style="margin-top:6px">${featurePoints.length ? featurePoints.map(f => `<span class="badge">${esc(f.fp_code)} ${esc(f.title)}</span> `).join('') : '<span class="sub">暂无关联功能点</span>'}</div>
      <div id="tc-features-edit" style="display:none;margin-top:8px"></div>
    </div>
    <h3 style="margin:14px 0 6px;font-size:15px">📋 执行记录</h3>
    <div class="fld-row" style="flex-wrap:wrap;align-items:flex-end">
      <label class="fld"><span>版本</span><select id="x-rel">${releases.map(r => `<option value="${r.id}">v${esc(r.version)}</option>`).join('') || '<option value="">（先创建版本）</option>'}</select></label>
      <label class="fld"><span>结果</span><select id="x-result">
        ${Object.entries(RES).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('')}</select></label>
      <label class="fld"><span>DEV号</span><input id="x-dev" style="width:110px;padding:8px"></label>
      <label class="fld"><span>EV号</span><input id="x-ev" style="width:110px;padding:8px"></label>
      <button class="btn primary small" onclick="saveExec(${id})">录入/更新</button>
    </div>
    <input id="x-conclusion" placeholder="结论备注（选填）" style="width:100%;padding:8px;margin-top:6px;box-sizing:border-box">
    ${ex.length ? ex.map(e => `<div class="tc-row" style="cursor:default">
      <span class="tc-code">v${esc(e.release_version)}</span>
      <span class="badge" style="color:${(RES[e.result]||RES[''])[1]};background:${(RES[e.result]||RES[''])[2]}">${(RES[e.result]||RES[''])[0]}</span>
      <span style="flex:1;font-size:13px">${esc(e.conclusion || '')}${e.dev_ref ? ' ｜ DEV:' + esc(e.dev_ref) : ''}${e.ev_ref ? ' ｜ EV:' + esc(e.ev_ref) : ''}</span>
      <span class="sub mono" style="color:#888;font-size:12px">${esc(e.executor || '-')} ｜ ${esc((e.executed_at || '').slice(0, 10))}</span>
    </div>`).join('') : '<div class="sub" style="color:#aaa;padding:6px 0">暂无执行记录</div>'}`;
}
function toggleEdit() {
  const e = $('tc-edit'), v = $('tc-view');
  const show = e.style.display === 'none';
  e.style.display = show ? 'flex' : 'none'; v.style.display = show ? 'none' : '';
}
async function saveTc(id, expectedVersion, approved) {
  if (approved && !$('t-summary').value.trim()) { alert('已批准用例的修订摘要必填'); return; }
  const r = await api('/api/testcases/' + id, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ expected_version: expectedVersion, title: $('t-title').value.trim(), steps_md: $('t-steps').value,
      risk: $('t-risk').value, ctype: $('t-ctype').value, related_req: $('t-req').value || null,
      change_summary: $('t-summary').value })
  });
  if (r.ok) openTc(id); else alert(r.error || '保存失败');
}
async function approve(id) {
  await api('/api/testcases/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'status', status: 'approved' }) });
  openTc(id);
}
async function unapprove(id) {
  await api('/api/testcases/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'status', status: 'draft' }) });
  openTc(id);
}
async function editTcFeatures(id, projectId) {
  try {
    const r = await api('/api/feature-points?project_id=' + encodeURIComponent(projectId));
    if (detailTcId !== id) return;
    if (!r.ok) { alert(r.error || '加载功能点失败'); return; }
    const items = r.items || [], chosen = new Set(detailFeaturePoints.map(f => f.id));
    const available = new Set(items.map(f => f.id));
    const missing = detailFeaturePoints.filter(f => !available.has(f.id));
    const container = $('tc-features-edit');
    container.style.display = 'block';
    if (missing.length) {
      container.innerHTML = '<div class="err">已关联的功能点中有不可选项，请先在功能点页恢复后再编辑，避免丢失关联。</div>';
      return;
    }
    container.innerHTML = (items.length ? items.map(f => `<label style="display:block"><input type="checkbox" name="tc-fp" value="${Number(f.id)}" ${chosen.has(f.id) ? 'checked' : ''}> ${esc(f.fp_code)} ${esc(f.title)}</label>`).join('') : '<div class="sub">当前项目暂无可关联功能点</div>') +
      `<button class="btn primary small" style="margin-top:8px" onclick="saveTcFeatures(${id})">保存关联</button> <button class="btn small" onclick="document.getElementById('tc-features-edit').style.display='none'">取消</button>`;
  } catch (e) { if (detailTcId === id) alert('加载功能点失败'); }
}
async function saveTcFeatures(id) {
  const fp_ids = Array.from(document.querySelectorAll('#tc-features-edit input[name="tc-fp"]:checked'), el => Number(el.value));
  if (fp_ids.length > 90) { alert('最多关联 90 个功能点'); return; }
  try {
    const r = await api('/api/testcases/' + id + '/features', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({fp_ids}) });
    if (!r.ok) { alert(r.error || '保存关联失败'); return; }
    if (detailTcId === id) await openTc(id);
  } catch (e) { alert('保存关联失败'); }
}
async function changeTcRetired(id, action) {
  if (!confirm(action === 'retire' ? '确认退役该用例？' : '确认恢复该用例？')) return;
  try {
    const r = await api('/api/testcases/' + id + '/' + action, { method:'POST' });
    if (!r.ok) { alert(r.error || '操作失败'); return; }
    if (detailTcId === id) await openTc(id);
  } catch (e) { alert('操作失败'); }
}
async function showTcVersions(id) {
  try {
    const r = await api('/api/testcases/' + id + '/versions');
    if (detailTcId !== id) return;
    if (!r.ok) { alert(r.error || '加载版本历史失败'); return; }
    const versions = (r.versions || []).slice().sort((a, b) => Number(b.version) - Number(a.version));
    const el = $('tc-versions'); el.style.display = 'block';
    el.innerHTML = '<strong>版本历史</strong>' + (versions.length ? versions.map(v => `<details style="margin-top:8px"><summary>v${esc(v.version)} ｜ ${esc(v.change_summary || '无摘要')} ｜ ${esc(v.author || '-')} ｜ ${esc(v.created_at || '-')}</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(v.steps_md || '')}</pre></details>`).join('') : '<div class="sub">暂无历史版本</div>');
  } catch (e) { if (detailTcId === id) alert('加载版本历史失败'); }
}
async function delTc(id) {
  if (!confirm('确认删除该用例（含版本与执行记录）？')) return;
  const r = await api('/api/testcases/' + id, { method: 'DELETE' });
  if (r.ok) { closeDetail(); loadList(); } else alert(r.error || '删除失败');
}
async function saveExec(id) {
  if (!$('x-rel').value) { alert('请先在该项目创建版本'); return; }
  const r = await api('/api/testcases/' + id + '/execution', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ release_id: +$('x-rel').value, result: $('x-result').value,
      conclusion: $('x-conclusion').value, dev_ref: $('x-dev').value.trim(), ev_ref: $('x-ev').value.trim() })
  });
  if (r.ok) openTc(id); else alert(r.error || '录入失败');
}
$('n-save').onclick = async () => {
  const title = $('n-title').value.trim();
  if (!title) { $('n-err').textContent = '标题必填'; $('n-err').style.display = 'block'; return; }
  const r = await api('/api/testcases', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ project_id: parseInt($('n-proj').value, 10), title,
      steps_md: $('n-steps').value, risk: $('n-risk').value, ctype: $('n-ctype').value,
      related_req: $('n-req').value || null })
  });
  if (r && r.ok) { closeNew(); $('proj-sel').value = $('n-proj').value; loadList(); }
  else { $('n-err').textContent = (r && r.error) || '创建失败'; $('n-err').style.display = 'block'; }
};
$('n-proj').addEventListener('change', refreshReqOptions);
init();
</script>
</body>
</html>
