<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 需求池</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-bg">
<div class="login-card">
  <div class="login-logo">POOL <span>/</span> R&amp;D</div>
  <div class="login-title">需求池</div>
  <p class="login-sub">现场需求与缺陷回流</p>
  <input type="text" id="u" aria-label="用户名" placeholder="用户名" autocomplete="username">
  <div style="height:12px"></div>
  <input type="password" id="p" aria-label="密码" placeholder="密码" autocomplete="current-password">
  <button class="login-btn" id="go">登录</button>
  <div class="login-err" id="err"></div>
  <div class="login-foot">cf-story-pool</div>
</div>
<script>
const $ = id => document.getElementById(id);
async function login() {
  $('err').textContent = '';
  $('go').disabled = true;
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('u').value.trim(), password: $('p').value })
    });
    const d = await r.json();
    if (r.ok && d.ok) {
      // 带 next 回跳（如从需求深链登录进来），只接受站内路径防开放重定向
      const nx = new URL(location.href).searchParams.get('next');
      location.href = (nx && nx.startsWith('/') && !nx.startsWith('//')) ? nx : '/';
      return;
    }
    $('err').textContent = d.error || ('登录失败 ' + r.status);
  } catch (e) { $('err').textContent = '网络错误，请重试'; }
  $('go').disabled = false;
}
$('go').onclick = login;
$('p').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('u').addEventListener('keydown', e => { if (e.key === 'Enter') $('p').focus(); });
</script>
</body>
</html>
