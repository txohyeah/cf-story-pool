<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>需求池</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="topbar">
  <span class="brand" style="cursor:pointer" onclick="goHome()">📥 需求池</span>
  <a class="btn small" href="/index.html" id="btn-home" style="display:none">📁 项目列表</a>
  <a class="btn primary small" href="javascript:PoolUI.openNewReqModalForPage(3, function (id) { page = 1; loadList(); openReq(id); })" id="btn-new">＋ 新需求</a>
  <a class="btn small" href="/docs.html" id="btn-docs">📄 文档</a>
  <a class="btn small" href="/releases.html" id="btn-rel">🚀 版本</a>
  <a class="btn small" href="/testcases.html" id="btn-tc">🧪 用例</a>
  <a class="btn small" href="javascript:exportCsv()" id="btn-export">⬇ 导出</a>
  <span class="sp"></span>
  <span class="sub" id="who"></span>
  <select id="g-bar" title="全局项目"></select>
  <a class="btn small" href="javascript:openPwdModal()">改密码</a>
  <a class="btn small" href="javascript:logout()">退出</a>
</div>
<div class="wrap">

  <!-- 视图一：项目列表 -->
  <div id="view-projects" style="display:none">
    <div class="proj-head">
      <h2>研发项目</h2>
      <a class="btn small" href="/index.html?project=all">查看全部需求</a>
      <button class="btn small" onclick="openProjModal()">＋ 新项目</button>
    </div>
    <div class="proj-grid" id="proj-grid"></div>
  </div>

  <!-- 视图二：需求列表（宽屏双栏：左=我的工作项 sticky，右=需求列表） -->
  <div id="view-list" style="display:none">
    <div class="list-layout">
      <div class="card side-work" id="mywork-card" style="display:none">
        <h3>🔨 我的工作项（未完成）</h3>
        <label class="mw-sync"><input type="checkbox" id="mw-sync"> 同步需求过滤</label>
        <div id="mywork"></div>
      </div>
      <div class="card list-main">
        <div class="fld-row" style="margin-bottom:10px">
          <label class="fld" style="min-width:150px"><span>项目</span><select id="f-project"></select></label>
          <label class="fld" style="min-width:130px"><span>状态</span><select id="f-status">
            <option value="">全部</option><option value="open">未关闭</option>
          </select></label>
          <label class="fld" style="min-width:90px"><span>类型</span><select id="f-type">
            <option value="">全部</option><option value="bug">Bug</option>
            <option value="req">需求</option><option value="opt">优化</option>
          </select></label>
          <label class="fld" style="min-width:100px"><span>紧急</span><select id="f-urgency">
            <option value="">全部</option><option value="urgent">仅紧急</option>
          </select></label>
          <label class="fld" style="min-width:100px"><span>级别</span><select id="f-severity">
            <option value="">全部</option><option value="critical">关键</option>
            <option value="major">重大</option><option value="general">一般</option>
            <option value="watch">观察</option><option value="none">未定级</option>
          </select></label>
          <label class="fld" style="min-width:120px"><span>标签</span><select id="f-tag"></select></label>
          <label class="fld" style="flex:2;min-width:160px"><span>搜索</span>
            <input type="text" id="f-q" placeholder="标题 / 描述关键词；#编号直达"></label>
        </div>
        <div id="list"></div>
        <div class="pager" id="pager" style="display:none">
          <a class="btn small" href="javascript:goPage(-1)">上一页</a>
          <span class="sub" id="pinfo"></span>
          <a class="btn small" href="javascript:goPage(1)">下一页</a>
        </div>
      </div>
    </div>
  </div>
</div>






<!-- 新建项目弹框 -->
<div class="modal-overlay" id="proj-overlay" style="display:none">
  <div class="modal">
    <h3>新建研发项目</h3>
    <label>项目名称<input type="text" id="proj-name" maxlength="50" placeholder="如：智习岛 P2"></label>
    <div class="err" id="proj-err" style="margin:2px 0 0"></div>
    <div class="modal-btns">
      <button class="btn" onclick="closeProjModal()">取消</button>
      <button class="btn primary" id="proj-save">创建</button>
    </div>
  </div>
</div>

<!-- 需求详情抽屉：列表页内直接看/改需求，Esc 或浏览器返回键关闭 -->
<div class="drawer-overlay" id="drawer-overlay" style="display:none">
  <aside class="drawer" role="dialog" aria-label="需求详情">
    <div class="drawer-head">
      <button class="btn small" id="dr-prev" title="上一条（←）">← 上一条</button>
      <button class="btn small" id="dr-next" title="下一条（→）">下一条 →</button>
      <span class="sub" id="dr-pos"></span>
      <span style="flex:1"></span>
      <button class="btn small" id="dr-close" title="关闭（Esc）">✕ 关闭</button>
    </div>

    <div class="card" id="info"></div>

    <div class="card" id="edit-card" style="display:none">
      <h3>✏️ 编辑</h3>
      <label class="fld"><span>标题</span><input type="text" id="e-title" maxlength="200"></label>
      <div class="sub" style="font-size:12px;color:#666;margin-bottom:6px">当前状态：<span id="e-cur-status"></span>（状态变更请用下方「状态流转」）</div>
      <label class="fld"><span>描述 / 复现步骤</span><textarea id="e-desc" rows="5"></textarea></label>
      <div class="fld-row">
        <label class="fld"><span>项目</span><select id="e-project"></select></label>
        <label class="fld"><span>类型</span><select id="e-type">
          <option value="req">需求</option><option value="bug">Bug</option><option value="opt">优化</option>
        </select></label>
        <label class="fld"><span>紧急度</span><select id="e-urgency">
          <option value="normal">普通</option><option value="urgent">紧急</option>
        </select></label>
      </div>
      <div class="fld-row">
        <label class="fld"><span>严重级别</span><select id="e-severity">
          <option value="">未定级</option><option value="critical">关键</option>
          <option value="major">重大</option><option value="general">一般</option>
          <option value="watch">观察</option>
        </select></label>
        <label class="fld"><span>根因分类</span><select id="e-root-cause">
          <option value="">未填</option><option value="config">配置</option>
          <option value="defect">缺陷</option><option value="usage">使用</option>
          <option value="external">外部依赖</option><option value="data">数据</option>
          <option value="requirement">需求有误</option>
        </select></label>
        <label class="fld"><span>关联编号</span><input type="text" id="e-ref-code" maxlength="60" placeholder="ISS-2026-001"></label>
      </div>
      <div class="sub" style="font-size:12px;color:#a05a00">涉及权限、稽查轨迹、编号唯一性、数据更正留痕的问题，级别最低应定为「重大」</div>
      <button class="btn primary" id="e-save">保存修改</button>
      <div class="err" id="e-err"></div>
    </div>

    <div class="card">
      <h3>🔁 状态流转</h3>
      <div class="fld-row" style="align-items:flex-end">
        <label class="fld" style="min-width:150px"><span>移动到</span><select id="s-next"></select></label>
        <label class="fld" style="flex:1;min-width:140px"><span>备注（可选）</span><input type="text" id="s-note" maxlength="200"></label>
        <button class="btn primary" id="s-go">流转</button>
      </div>
      <div id="dup-row" style="display:none;margin-top:8px">
        <label class="fld"><span>原单 ID（本条与之重复）</span>
          <input type="text" id="s-dup" inputmode="numeric" placeholder="输入原单编号，如 12"></label>
      </div>
      <div class="err" id="s-err"></div>
    </div>

    <div class="card">
      <h3>🏷️ 标签</h3>
      <div id="tags"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input type="text" id="tag-in" list="tag-list" placeholder="输入标签" style="flex:1">
        <datalist id="tag-list"></datalist>
        <button class="btn small" id="tag-add">添加标签</button>
      </div>
    </div>

    <div class="card">
      <h3>🔨 工作项清单（接力顺序 = 行顺序）</h3>
      <div id="chk"></div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center">
        <input type="text" id="ck-content" placeholder="工作内容，如：后端开发" style="flex:1;min-width:150px">
        <select id="ck-assignee" style="width:auto"></select>
        <button class="btn small" id="ck-add">添加工作项</button>
      </div>
    </div>

    <div class="card" id="att-card" style="display:none">
      <h3>🖼️ 截图附件</h3>
      <div id="atts" style="display:flex;gap:10px;flex-wrap:wrap"></div>
    </div>

    <div class="card">
      <h3>💬 评论</h3>
      <div class="fld-row" style="margin-bottom:6px">
        <label class="fld" style="min-width:150px"><span>类型</span><select id="c-ctype">
          <option value="normal">普通评论</option>
          <option value="ac">验收标准</option>
        </select></label>
        <label class="fld" style="min-width:130px"><span>只看类型</span><select id="c-filter">
          <option value="">全部</option><option value="normal">普通</option>
          <option value="ac">验收标准</option>
        </select></label>
      </div>
      <textarea id="c-text" rows="3" placeholder="补充信息、确认结果…"></textarea>
      <div style="margin-top:8px"><button class="btn primary small" id="c-go">发送评论</button></div>
    </div>

    <div class="card">
      <h3>📜 流水</h3>
      <div id="events"></div>
    </div>
  </aside>
</div>

<script src="/app-common.js"></script>
<script src="/app-common.js"></script>
<script>
const $ = id => document.getElementById(id);
const ST = { submitted:'待复现确认', confirmed:'已确认', scheduled:'已排期', fixed:'已修复',
  verified:'已验证', closed:'已关闭', dup_closed:'重复关闭' };
const TY = { bug:'Bug', req:'需求', opt:'优化' };
const SEVN = { critical:'关键', major:'重大', general:'一般', watch:'观察' };
const SEVC = { critical:'#b91c1c', major:'#c2410c', general:'#a16207', watch:'#64748b' };
const RCN = { config:'配置', defect:'缺陷', usage:'使用', external:'外部依赖', data:'数据', requirement:'需求有误' };
let page = 1, pages = 1, me = null;
const URL_PROJECT = new URL(location.href).searchParams.get('project');

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(iso) { if (!iso) return ''; const d = new Date(iso.includes('T') ? iso : iso.replace(' ', 'T') + 'Z');
  return isNaN(d) ? iso : d.toLocaleString('zh-CN', { hour12: false }); }
function goHome() { location.href = '/index.html'; }

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) { location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); throw new Error('未登录'); }
  return r.json();
}

// ---------- 项目视图 ----------
async function loadProjects() {
  const d = await api('/api/projects');
  $('proj-grid').innerHTML = d.projects.length ? d.projects.map(p =>
    '<div class="proj-card" onclick="location.href=\'/index.html?project=' + p.id + '\'">'
    + '<div class="pname">📁 ' + esc(p.name) + '</div>'
    + '<div class="pstat">进行中 <b>' + p.open + '</b> / 共 ' + p.total + ' 条需求</div>'
    + '<div class="pgo">进入项目 →</div></div>').join('')
    : '<div class="card sub" style="text-align:center;padding:30px">还没有项目，点右上角「＋ 新项目」创建</div>';
}
function openProjModal() { $('proj-err').textContent = ''; $('proj-name').value = ''; $('proj-overlay').style.display = ''; $('proj-name').focus(); }
function closeProjModal() { $('proj-overlay').style.display = 'none'; }
$('proj-save').onclick = async () => {
  const name = $('proj-name').value.trim();
  if (!name) { $('proj-err').textContent = '请输入项目名称'; return; }
  const d = await api('/api/projects', { method: 'POST',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
  if (d.ok) { closeProjModal(); loadProjects(); } // 建项目入口只在项目视图（列表页用顶栏「项目列表」返回后创建）
  else $('proj-err').textContent = d.error || '创建失败';
};
$('proj-name').addEventListener('keydown', e => { if (e.key === 'Enter') $('proj-save').click(); });

// ---------- 列表视图 ----------
function itemHtml(x) {
  const tags = (x.tags || []).map(t => '<span class="tag-chip">' + esc(t) + '</span>').join('');
  const tasks = x.open_tasks ? ' <span title="未完成工作项">🔨' + x.open_tasks + '</span>' : '';
  return '<a class="row-item" href="/index.html?project=all&req=' + x.id + '" onclick="rowClick(event, ' + x.id + ')">'
    + '<div class="ri-top"><span class="rid">#' + x.id + '</span>'
    + '<span class="ri-title">' + esc(x.title) + '</span>'
    + (x.urgency === 'urgent' ? '<span class="badge ug-urgent">紧急</span>' : '')
    + '<span class="badge st-' + x.status + ' clickable" title="点击快捷改状态"'
    + ' onclick="openStatusMenu(event, ' + x.id + ', \'' + x.status + '\')">'
    + (ST[x.status] || x.status) + '</span></div>'
    + '<div class="ri-meta"><span>' + esc(x.project_name) + '</span>'
    + '<span class="badge ty-' + x.type + '">' + (TY[x.type] || x.type) + '</span>'
    + tags + tasks
    + '<span style="margin-left:auto">' + esc(x.creator_name || '') + ' · ' + fmtTime(x.updated_at) + '</span></div></a>';
}

// ---------- 状态快捷菜单（列表页直接改状态） ----------
const SM_ORDER = ['submitted', 'confirmed', 'scheduled', 'fixed', 'verified', 'closed'];
let statusMenuEl = null;
let relList = [];  // 关联版本候选列表
function closeStatusMenu() {
  if (statusMenuEl) { statusMenuEl.remove(); statusMenuEl = null; }
}
function openStatusMenu(ev, id, cur) {
  ev.preventDefault(); ev.stopPropagation(); closeStatusMenu();
  const m = document.createElement('div');
  m.className = 'status-menu';
  m.innerHTML = SM_ORDER.map(s =>
    '<div class="sm-item' + (s === cur ? ' cur' : '') + '" data-s="' + s + '">'
    + (s === cur ? '✓ ' : '') + ST[s] + '</div>').join('')
    + '<div class="sm-tip">重复关闭请点开需求后在「状态流转」操作</div>';
  document.body.appendChild(m);
  statusMenuEl = m;
  const r = ev.target.getBoundingClientRect();
  const mw = m.offsetWidth, mh = m.offsetHeight;
  let x = Math.min(r.left, window.innerWidth - mw - 8);
  let y = r.bottom + 4;
  if (y + mh > window.innerHeight - 8) y = Math.max(8, r.top - mh - 4);
  m.style.left = Math.max(8, x) + 'px';
  m.style.top = y + 'px';
  m.addEventListener('click', async e => {
    const s = e.target.dataset && e.target.dataset.s;
    closeStatusMenu();
    if (!s || s === cur) return;
    await api('/api/requirements/' + id, { method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ op: 'status', status: s, note: '列表页快捷流转' }) });
    loadList(); loadMyWork();
  });
  setTimeout(() => document.addEventListener('click', closeStatusMenu, { once: true }), 0);
}

// ---------- 需求详情抽屉（列表页内直接看/改需求，Esc 或浏览器返回键关闭） ----------
const ACTN = { create:'📥 创建', status:'🔁 流转', comment:'💬 评论', checklist:'🔨 清单',
  tag:'🏷️ 标签', edit:'✏️ 编辑' };
let D = null, users = [], allTags = [], curReqId = 0, drawerOpen = false, drawerPushed = false, listItems = [];

function rowClick(ev, id) {
  // 修饰键 / 中键点击放行：浏览器默认新标签打开 href（列表页 + 自动弹该条抽屉）
  if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey || ev.button !== 0) return;
  ev.preventDefault();
  openReq(id);
}
function gotoReq(id) { openReq(id); } // 抽屉内跳到另一条（如重复单原单）

function drawerUrl(id) {
  const sp = new URLSearchParams(location.search);
  sp.set('req', id);
  return '/index.html?' + sp.toString();
}
function showDrawer() {
  closeStatusMenu();
  $('drawer-overlay').style.display = 'flex';
  document.body.classList.add('noscroll');
  requestAnimationFrame(() => $('drawer-overlay').classList.add('open'));
  drawerOpen = true;
}
function hideDrawer() {
  $('drawer-overlay').classList.remove('open');
  drawerOpen = false; curReqId = 0;
  document.body.classList.remove('noscroll');
  setTimeout(() => { if (!drawerOpen) $('drawer-overlay').style.display = 'none'; }, 260);
}
function openReq(id) {
  if (!id) return;
  if (drawerOpen) history.replaceState(null, '', drawerUrl(id)); // 抽屉内换条：替换历史，返回键仍是关抽屉
  else { history.pushState(null, '', drawerUrl(id)); drawerPushed = true; }
  showDrawer();
  loadReq(id);
}
function closeReq() {
  // 由本页 pushState 打开的：后退一步（返回键/点关闭行为一致），popstate 里真正收尾
  if (drawerPushed && new URLSearchParams(location.search).get('req')) { history.back(); return; }
  // 深链直达（历史不是本页 push 的）：清掉 req 参数直接关，避免 back 跳出站点
  drawerPushed = false;
  const sp = new URLSearchParams(location.search);
  sp.delete('req');
  history.replaceState(null, '', '/index.html' + (sp.toString() ? '?' + sp.toString() : ''));
  hideDrawer();
}
function syncDrawerFromUrl() {
  const id = parseInt(new URL(location.href).searchParams.get('req'), 10);
  if (id) {
    drawerPushed = true;
    const changed = id !== curReqId;
    showDrawer();
    if (changed) loadReq(id);
  } else { drawerPushed = false; hideDrawer(); }
}
window.addEventListener('popstate', syncDrawerFromUrl);

async function loadReq(id) {
  curReqId = id;
  $('info').innerHTML = '<div class="sub" style="padding:30px;text-align:center">加载中…</div>';
  $('edit-card').style.display = 'none';
  $('att-card').style.display = 'none';
  for (const cid of ['tags', 'chk', 'atts', 'events']) $(cid).innerHTML = '';
  $('c-text').value = '';
  const d = await api('/api/requirements/' + id);
  if (curReqId !== id) return; // 加载期间已切到别的条
  if (!d.ok) { $('info').innerHTML = '<div class="err" style="padding:16px">' + esc(d.error || '加载失败') + '</div>'; return; }
  D = d;
  relList = await api('/api/releases?project=' + D.req.project_id).then(x => x.items || []).catch(() => []);
  refreshDrawerDatalist(D.req.project_id); // 标签联想按需求所属项目
  renderInfo(); renderStatus(); renderTags(); renderChk(); renderAtts(); renderEvents();
  updateNavBtns();
}

function updateNavBtns() {
  const i = listItems.findIndex(x => x.id === curReqId);
  const canPrev = i > 0 || page > 1;
  const canNext = (i >= 0 && i < listItems.length - 1) || page < pages;
  $('dr-prev').disabled = !canPrev;
  $('dr-next').disabled = !canNext;
  $('dr-pos').textContent = i >= 0 ? '本页第 ' + (i + 1) + ' / ' + listItems.length + ' 条' : '';
}
async function navReq(delta) {
  if (!curReqId || !listItems.length) return;
  const i = listItems.findIndex(x => x.id === curReqId);
  if (i < 0) return;
  const j = i + delta;
  if (j >= 0 && j < listItems.length) { openReq(listItems[j].id); return; }
  // 本页到头：自动翻页取另一端第一条，过需求可以连续翻
  if (delta > 0 && page < pages) {
    page += 1; await loadList(); if ($('mw-sync').checked) loadMyWork();
    if (listItems.length) openReq(listItems[0].id);
  } else if (delta < 0 && page > 1) {
    page -= 1; await loadList(); if ($('mw-sync').checked) loadMyWork();
    if (listItems.length) openReq(listItems[listItems.length - 1].id);
  }
}
$('dr-prev').onclick = () => navReq(-1);
$('dr-next').onclick = () => navReq(1);
$('dr-close').onclick = closeReq;
$('drawer-overlay').addEventListener('click', e => {
  if (e.target === $('drawer-overlay')) closeReq(); // 点遮罩空白处关闭，点抽屉内部不关
});

// Esc 关闭、←/→ 上下条（焦点在输入框时不抢按键）
document.addEventListener('keydown', e => {
  if (!drawerOpen) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  if (e.key === 'Escape') closeReq();
  else if (e.key === 'ArrowLeft') navReq(-1);
  else if (e.key === 'ArrowRight') navReq(1);
});

function renderInfo() {
  const r = D.req;
  const dup = D.dup_of
    ? '<div style="margin-top:6px">↩️ 重复单，原单：<a href="javascript:void(0)" onclick="gotoReq(' + D.dup_of.id + ')">#' + D.dup_of.id
      + ' ' + esc(D.dup_of.title) + '</a></div>' : '';
  const relsel = (relList.length || D.req.release_id)
    ? '<div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
      + '<span style="font-size:13px">🚀 关联版本：</span>'

function syncUrl() {
  if ($('view-list').style.display === 'none') return; // 只在列表模式同步
  const sp = new URLSearchParams();
  sp.set('project', $('f-project').value || 'all');
  sp.set('status', $('f-status').value);
  if ($('f-type').value) sp.set('type', $('f-type').value);
  if ($('f-urgency').value) sp.set('urgency', $('f-urgency').value);
  if ($('f-tag').value) sp.set('tag', $('f-tag').value);

  const curReq = new URL(location.href).searchParams.get('req'); // 详情抽屉开着时保留 req 深链参数
  if (curReq) sp.set('req', curReq);
  history.replaceState(null, '', '/index.html?' + sp.toString());
}

// 侧栏直接勾完成：乐观反馈（划线淡出），后台 PATCH，成功后刷新侧栏与列表计数
async function toggleWorkItem(ev, cid, el) {
  ev.preventDefault(); ev.stopPropagation();
  if (el.dataset.busy) return;
  el.dataset.busy = '1';
  const row = el.closest('.row-item');
  row.style.transition = 'opacity .35s, transform .35s';
  row.style.opacity = '0.35';
  row.style.textDecoration = 'line-through';
  try {
    await api('/api/checklist/' + cid, { method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'done' }) });
    setTimeout(() => { loadMyWork(); loadList(); }, 380);
  } catch (e) {
    row.style.opacity = ''; row.style.textDecoration = '';
    alert('勾选失败，请重试');
  }
}

let debTimer = null;
// 编号直达：搜索框输 #181 / 181（全角＃也认）→ 存在即弹抽屉，不存在退回普通文本搜索
// R3：ISS-/CR-/DEV-/EV- 前缀（如 ISS-2026-001）→ 按 ref_code 精确查，命中弹抽屉
function parseReqIdQuery() {
  const m = $('f-q').value.trim().match(/^[#＃]?(\d+)$/);
  return m ? parseInt(m[1], 10) : 0;
}
function parseRefQuery() {
  const m = $('f-q').value.trim().match(/^(?:ISS|CR|DEV|EV|TC)-[\w-]{1,40}$/i);
  return m ? m[0].toUpperCase() : '';
}
async function jumpToRef(code) {
  const d = await api('/api/requirements?ref=' + encodeURIComponent(code) + '&page_size=1');
  const hit = d.items && d.items[0];
  $('f-q').value = ''; page = 1; $('f-q').blur();
  if (hit) { openReq(hit.id); } else { loadList(); }
  if ($('mw-sync').checked) loadMyWork();
}
async function jumpToReq(id) {
  let d;
  try { d = await api('/api/requirements/' + id); } catch (e) { d = { ok: false }; }
  if (d.ok) {
    $('f-q').value = ''; page = 1; $('f-q').blur();
    openReq(id); loadList(); if ($('mw-sync').checked) loadMyWork();
  } else {
    page = 1; loadList(); if ($('mw-sync').checked) loadMyWork(); // 没这个编号：当普通关键词搜
  }
}
$('f-q').addEventListener('input', () => {
  clearTimeout(debTimer);
  const id = parseReqIdQuery();
  const ref = parseRefQuery();
  debTimer = setTimeout(() => {
    if (id) { jumpToReq(id); return; } // 纯编号输入：不闪文本搜索，防抖后直达
    if (ref) { jumpToRef(ref); return; } // 关联编号（ISS-xxx 等）：按 ref_code 精确查
    page = 1; loadList(); if ($('mw-sync').checked) loadMyWork();
  }, 400);
});
$('f-q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = parseReqIdQuery();
  const ref = parseRefQuery();
  if (!id && !ref) return; // 普通文本：维持原防抖搜索不动
  clearTimeout(debTimer);
  if (id) jumpToReq(id); else jumpToRef(ref);
});
for (const id of ['f-project', 'f-status', 'f-type', 'f-urgency', 'f-severity', 'f-tag']) {
  $(id).addEventListener('change', () => { page = 1; loadList(); if ($('mw-sync').checked) loadMyWork(); });
}

(async function init() {
  // me 与 bootstrap 并行，省一个往返
  const pBoot = api('/api/bootstrap');
  PoolUI.renderProjectBar('g-bar', { allowAll: true, onChange: v => { location.href = v ? '/index.html?project=' + v : '/index.html?project=all'; } });
  const m = await api('/api/me');
  if (!m.authed) { location.href = '/login'; return; }
  me = m;
  $('who').textContent = m.display_name;
  const b = await pBoot;
  $('f-project').innerHTML = '<option value="">全部项目</option>'
    + b.projects.map(p => '<option value="' + p.id + '">' + esc(p.name) + '</option>').join('');
  $('f-status').innerHTML += ['submitted','confirmed','scheduled','fixed','verified','closed','dup_closed']
    .map(s => '<option value="' + s + '">' + ST[s] + '</option>').join('');
  $('f-tag').innerHTML = '<option value="">全部</option>';
  allTags = b.tags; // [{id, name, project_id}] 一行一(标签,项目)；选项按当前项目过滤
  users = b.users;
  $('e-project').innerHTML = b.projects.map(p => '<option value="' + p.id + '">' + esc(p.name) + '</option>').join('');
  $('ck-assignee').innerHTML = '<option value="">未指派</option>'
    + users.map(us => '<option value="' + us.id + '">' + esc(us.display_name) + '</option>').join('');

  // 从 URL 恢复上次离开时的筛选/页码（写入动作在 loadList 的 syncUrl 里）
  const SP = new URL(location.href).searchParams;
  const upage = parseInt(SP.get('page'), 10);
  if (upage >= 1) page = upage;
  // 上次离开列表页的滚动位置（pagehide 里记录），取完即清
  const sy = parseInt(sessionStorage.getItem('sp_scroll') || '0', 10);
  sessionStorage.removeItem('sp_scroll');
  const ureq = parseInt(SP.get('req'), 10);

  if (URL_PROJECT || ureq) {
    // 列表模式：URL 指定项目（all = 全部）；带 req 深链时也进列表模式并自动弹抽屉
    $('view-list').style.display = '';
    $('btn-home').style.display = ''; // 顶栏显式返回项目列表入口（点 logo 回首页太隐晦）
    if (!URL_PROJECT || URL_PROJECT === 'all') {
      const gp = PoolUI.getProject();
      if (gp) setSel('f-project', gp);
    } else {
      setSel('f-project', URL_PROJECT);
    }
    setSel('f-status', SP.has('status') ? SP.get('status') : 'open'); // 默认只看未关闭
    if (SP.has('type')) setSel('f-type', SP.get('type'));
    if (SP.has('urgency')) setSel('f-urgency', SP.get('urgency'));
    if (SP.has('q')) $('f-q').value = SP.get('q');
    // #197 组件化：btn-new 已改弹框调用（PoolUI），不再动态改 href
    refreshTagFilter(SP.get('tag')); // 按所选项目过滤标签选项，尽量保留 URL 里的 tag
    loadMyWork();
    await loadList();
    if (ureq) syncDrawerFromUrl(); // 深链：自动打开详情抽屉
    else if (sy > 0) window.scrollTo(0, sy);
  } else {
    // 项目视图（工作项侧栏只在列表模式，项目页不请求）
    $('view-projects').style.display = '';
    loadProjects();
  }
})();

// 标签按项目隔离：取某项目下的标签名（全部项目视图 = 跨项目去重）
function tagNamesForProject(pid) {
  const names = new Set();
  for (const t of allTags) {
    if (!t.project_id) continue; // 无归属标签（从未被需求使用）不进下拉
    if (!pid || String(t.project_id) === String(pid)) names.add(t.name);
  }
  return [...names].sort((a, b) => a.localeCompare(b, 'zh-CN'));
}
// 重建 f-tag 选项；keep 传值时尽量保留该选中项（URL 恢复用），否则保留当前选中
function refreshTagFilter(keep) {
  const want = keep !== undefined ? keep : $('f-tag').value;
  const names = tagNamesForProject($('f-project').value);
  $('f-tag').innerHTML = '<option value="">全部</option>'
    + names.map(n => '<option value="' + esc(n) + '">' + esc(n) + '</option>').join('');
  if (want && names.includes(want)) $('f-tag').value = want;
}
// 抽屉标签联想：按需求所属项目过滤
function refreshDrawerDatalist(pid) {
  $('tag-list').innerHTML = tagNamesForProject(String(pid))
    .map(n => '<option value="' + esc(n) + '">').join('');
}
</script>
</body>
</html>
